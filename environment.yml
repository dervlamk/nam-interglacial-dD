# The conda environment for this project, and only this project.
#
# Deliberately self-contained: it replaces the shared `gcm_analysis` env, which is used by
# other projects too and so could not be pinned or extended without affecting them. One env
# serves BOTH halves of this repo — the model notebooks (Casper) and the proxy figure
# notebooks (laptop) — so a fresh clone runs everything from this one file.
#
# Create with:
#   conda env create -f environment.yml
# or, faster:
#   mamba env create -f environment.yml
#
# Then register the Jupyter kernel (the notebooks are saved against this name):
#   conda activate nam_dD_lig
#   python -m ipykernel install --user --name nam_dD_lig --display-name "nam_dD_lig"
#
# Versions are pinned to what the original environment used, without OS-specific
# build hashes, so this resolves on both linux-64 (Casper) and osx-arm64 (laptop).
name: nam_dD_lig
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.2
  - scipy=1.15
  - pandas=2.2
  - matplotlib-base=3.10
  - xarray=2025.3
  - netcdf4=1.7
  - metpy=1.6
  - cartopy=0.24
  - shapely=2.1
  - cmocean=4.0
  - colorcet=3.1
  - seaborn=0.13
  - ipykernel=6.29
  - nco=5.3      # command-line NCO tools used by scripts/*.sh
  - cdo=2.4       # command-line CDO tools
  - openpyxl=3.1  # reads the proxy .xlsx records under $PROXY_DATA_DIR (proxy notebooks)
  - xlrd=2.0      # legacy .xls — dD_nh22p.xls, the raw NH22P record, is old-format
